name: DocMeds Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          if [ ! -s debug.keystore ] || ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            echo "No valid debug.keystore found in repo or DEBUG_KEYSTORE_BASE64 secret; generating CI debug.keystore..."
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

      - name: Prepare and validate Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_APPLET_CONFIG_XML_BASE64: ${{ secrets.FIREBASE_APPLET_CONFIG_XML_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

          if [ -n "$FIREBASE_APPLET_CONFIG_XML_BASE64" ]; then
            echo "$FIREBASE_APPLET_CONFIG_XML_BASE64" | tr -d '\r\n ' | base64 -d > app/src/main/res/values/firebase_applet_config.xml
          fi

          if [ ! -f app/google-services.json ]; then
            echo "::error::Missing app/google-services.json. Commit app/google-services.json (with Web OAuth client_type 3 for com.aistudio.docmeds.kxpqzm) or configure the GOOGLE_SERVICES_JSON_BASE64 GitHub Actions secret."
            exit 1
          fi

          python3 - <<'PY'
          import json, sys
          with open("app/google-services.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          pkg = "com.aistudio.docmeds.kxpqzm"
          clients = data.get("client", [])
          matched = [
              c for c in clients
              if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == pkg
          ]
          if not matched:
              print(f"::error::app/google-services.json does not contain a client entry for package_name '{pkg}'.")
              sys.exit(1)
          oauth_clients = matched[0].get("oauth_client", [])
          has_web_client = any(o.get("client_type") == 3 and o.get("client_id") for o in oauth_clients)
          if not has_web_client:
              print(f"::error::app/google-services.json for '{pkg}' is missing an OAuth 2.0 Web Client ID (client_type: 3), which Google Services requires to generate R.string.default_web_client_id.")
              sys.exit(1)
          print(f"Verified app/google-services.json has Web OAuth Client ID for {pkg}.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests and Build Debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docmeds-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
